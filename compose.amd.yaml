# AMD ROCm hosts. The app gets the devices for rocm-smi in the Library hardware panel.
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-rocm-b12375
    environment:
      LLAMA_ARG_FIT_TARGET: ${LLAMA_ARG_FIT_TARGET:-1024} # llama.cpp's default; here it's VRAM, not host RAM
    devices: &amd-devices
      - /dev/kfd
      - /dev/dri
  web: &gpu
    devices: *amd-devices
  web-dev: *gpu
