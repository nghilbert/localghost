# Intel, or AMD without ROCm.
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b12375
    devices:
      - /dev/dri
    environment:
      # Under the default auto mode, RADV integrated GPUs lose the device on some models.
      LLAMA_ARG_LOAD_MODE: ${LLAMA_ARG_LOAD_MODE:-mmap}
      LLAMA_ARG_FIT_TARGET: ${LLAMA_ARG_FIT_TARGET:-1024} # llama.cpp's default; an integrated GPU's budget is already a share of RAM
