# Vulkan overlay (Intel, or AMD without ROCm). Swaps the bundled llama.cpp to
# the Vulkan image; turns on once /dev/dri is reachable. Unlike Ollama, llama.cpp's
# Vulkan backend doesn't skip integrated GPUs by default, so no extra opt-in env
# var is needed. Tune device selection with GGML_VK_VISIBLE_DEVICES=<ids>.
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10276
    devices:
      - /dev/dri
