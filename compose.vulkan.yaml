# Vulkan overlay (Intel, or AMD without ROCm). Vulkan ships in the default
# ollama/ollama image and turns on once /dev/dri is reachable — no image swap.
# Tune with OLLAMA_VULKAN=0 or GGML_VK_VISIBLE_DEVICES=<ids>.
services:
  ollama:
    devices:
      - /dev/dri
    # Ollama skips integrated GPUs by default; opt the iGPU (e.g. AMD Renoir) in.
    environment:
      OLLAMA_IGPU_ENABLE: "1"
