# Intel, or AMD without ROCm.
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-vulkan-b10920
    devices:
      - /dev/dri
    environment:
      # Under the default auto mode, RADV integrated GPUs lose the device on some models.
      LLAMA_ARG_LOAD_MODE: ${LLAMA_ARG_LOAD_MODE:-mmap}
