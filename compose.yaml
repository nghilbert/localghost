# Shared config for the prod (web) and dev (web-dev) app services. They are
# mutually exclusive on port 3000; COMPOSE_PROFILES picks one.
x-app: &app
  init: true
  restart: unless-stopped
  ports:
    - "3000:3000"
  # node has global fetch; the slim image has no curl. start_period covers the
  # prod migrate step and the dev Vite cold start.
  healthcheck:
    test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 40s
  environment: &app-env
    DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-localghost}"
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (64-char hex) in .env}
    SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    searxng:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-localghost}
    # Loopback-only: the native dev loop reaches it at localhost; web uses db:5432
    # over the compose network. Not exposed on external interfaces.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-localghost}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Production: the built image. COMPOSE_PROFILES selects prod or dev (web-dev).
  web:
    <<: *app
    build: .
    profiles: [ prod ]

  # Development: serves Vite with HMR over a bind mount instead of the built
  # bundle. Mutually exclusive with web (both bind 3000); pick one via profile.
  web-dev:
    <<: *app
    build:
      context: .
      target: dev
    profiles: [ dev ]
    ports:
      - "3000:3000"
      - "4206:4206" # TanStack devtools event bus; unpublished it spams ws errors in the browser
    volumes:
      - .:/app # live source for HMR
      - /app/node_modules # anonymous volume: keep the image's deps, don't shadow with host's
    environment:
      <<: *app-env

  # Bundled keyless web search, reachable by the app at http://searxng:8080.
  # See searxng/Dockerfile: config, base URL, and healthcheck are all baked in.
  searxng:
    build: ./searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped

  # Bundled llama.cpp (llama-server, router mode), reachable by the app at
  # http://llamacpp:8080. CPU-only here; GPU overlays patch this service (see
  # compose.nvidia/amd/vulkan.yaml). Gated by the `llamacpp` profile so
  # omitting it falls back to a host-native llama-server. --host/--port use the
  # image's own env defaults (a duplicate --host warns); --cors-origins is
  # scoped to our origin instead of "*"; --sse-ping-interval keeps /models/sse
  # alive; --api-key is appended only when LLAMACPP_API_KEY is set. No
  # healthcheck override needed: the `server` image's base installs curl and
  # ships its own `HEALTHCHECK CMD curl -f http://localhost:8080/health`
  # (.devops/cpu.Dockerfile upstream), which still applies since we only
  # override entrypoint/command, not the image's HEALTHCHECK.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: [ llamacpp ]
    entrypoint: [ "sh", "-c" ]
    command:
      - >-
        exec /app/llama-server --models-dir /models --models-max 2 --sse-ping-interval 30 --cors-origins "${BETTER_AUTH_URL:-http://localhost:3000}" ${LLAMACPP_API_KEY:+--api-key "$$LLAMACPP_API_KEY"}
    environment:
      LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-}
    volumes:
      - llamacpp:/models
    restart: unless-stopped

volumes:
  pg:
  llamacpp:
