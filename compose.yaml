# Shared config for the prod (web) and dev (web-dev) app services. They are
# mutually exclusive on port 3000; COMPOSE_PROFILES picks one.
x-app: &app
  ports:
    - "3000:3000"
  environment: &app-env
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Production: the built image. COMPOSE_PROFILES selects prod or dev (web-dev).
  web:
    <<: *app
    build: .
    profiles: [prod]

  # Development: serves Vite with HMR over a bind mount instead of the built
  # bundle. Mutually exclusive with web (both bind 3000); pick one via profile.
  web-dev:
    <<: *app
    build:
      context: .
      target: dev
    profiles: [dev]
    volumes:
      - .:/app             # live source for HMR
      - /app/node_modules  # anonymous volume: keep the image's deps, don't shadow with host's
    environment:
      <<: *app-env
      CHOKIDAR_USEPOLLING: "true"  # reliable file watching over the bind mount

  # One Ollama service per hardware variant; COMPOSE_PROFILES in .env picks one
  # (cpu, nvidia, or amd). All share the container name so the app reaches the
  # active one at http://ollama:11434 and two variants can never run at once.
  ollama-cpu:
    image: ollama/ollama
    container_name: ollama
    profiles: [cpu]
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ollama-nvidia:
    image: ollama/ollama
    container_name: ollama
    profiles: [nvidia]
    gpus: all
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

  ollama-amd:
    image: ollama/ollama:rocm
    container_name: ollama
    profiles: [amd]
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  db_data:
  ollama:
