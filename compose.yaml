# Rotates logs; Docker's default json-file driver never does.
x-logging: &logging
  driver: local

x-app: &app
  init: true
  logging: *logging
  restart: unless-stopped
  ports:
    - "3000:3000"
  # The slim image has no curl.
  healthcheck:
    test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 40s
  environment: &app-env
    DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432"
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (64-char hex) in .env}
    SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    HF_TOKEN: ${HF_TOKEN:-}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    LLAMA_API_KEY: ${LLAMA_API_KEY:-local-llamacpp}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    searxng:
      condition: service_healthy
    llamacpp:
      condition: service_started
      required: false

services:
  db:
    image: pgvector/pgvector:pg18
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # For the native dev loop.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Applies pending migrations, then exits.
  migrate:
    build:
      context: .
      target: migrate
    logging: *logging
    profiles: [ prod ]
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: .
      target: runtime
    profiles: [ prod ]
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      llamacpp:
        condition: service_started
        required: false

  web-dev:
    <<: *app
    build:
      context: .
      target: dev
    profiles: [ dev ]
    ports:
      - "3000:3000"
      - "4206:4206" # TanStack devtools event bus
    volumes:
      - .:/app
      - /app/node_modules # keeps the image's node_modules over the host's
    environment:
      <<: *app-env

  searxng:
    build: ./searxng
    logging: *logging
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped

  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-b10920
    logging: *logging
    profiles: [ llamacpp ]
    environment:
      LLAMA_CACHE: /models
      HF_TOKEN: ${HF_TOKEN:-}
      LLAMA_ARG_PORT: 8080
      LLAMA_API_KEY: ${LLAMA_API_KEY:-local-llamacpp} # llama-server reads this name without the ARG_ prefix
      LLAMA_ARG_SLEEP_IDLE_SECONDS: ${LLAMA_ARG_SLEEP_IDLE_SECONDS:-300}
      # Applies to every model the router loads; see .env.example.
      LLAMA_ARG_N_GPU_LAYERS: ${LLAMA_ARG_N_GPU_LAYERS:-auto}
      LLAMA_ARG_CTX_SIZE: ${LLAMA_ARG_CTX_SIZE:-0}
    volumes:
      - llamacpp:/models
    restart: unless-stopped

volumes:
  pg:
  llamacpp:
