# Shared config for the prod (web) and dev (web-dev) app services. They are
# mutually exclusive on port 3000; COMPOSE_PROFILES picks one.
x-app: &app
  init: true
  restart: unless-stopped
  ports:
    - "3000:3000"
  # node has global fetch; the slim image has no curl. start_period covers the
  # dev Vite cold start.
  healthcheck:
    test: [ "CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))" ]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 40s
  environment: &app-env
    DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-localghost}"
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY (64-char hex) in .env}
    SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
    HF_TOKEN: ${HF_TOKEN:-}
    LLAMACPP_API_KEY: ${LLAMACPP_API_KEY:-local-llamacpp}
    CODE_AGENT_WORKSPACE_ROOT: ${CODE_AGENT_WORKSPACE_ROOT:-${HOME}/localghost}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    db:
      condition: service_healthy
    searxng:
      condition: service_healthy

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-localghost}
    # Loopback-only: the native dev loop reaches it at localhost; web uses db:5432
    # over the compose network. Not exposed on external interfaces.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-localghost}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Pre-deploy step: applies pending migrations, then exits. web waits on it, so a
  # `docker compose up` on a fresh volume still comes up migrated. Its image is the
  # build stage, which carries the prisma CLI the lean runtime image drops.
  migrate:
    build:
      context: .
      target: migrate
    profiles: [ prod ]
    restart: "no"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-localghost}"
    depends_on:
      db:
        condition: service_healthy

  # Production: the built image. COMPOSE_PROFILES selects prod or dev (web-dev).
  web:
    <<: *app
    build: .
    profiles: [ prod ]
    volumes:
      # /agent's workspace root, mounted at the same path so a directory the user
      # types resolves identically inside and out. Defaults to $HOME, so it needs
      # no configuration to work.
      - "${CODE_AGENT_WORKSPACE_ROOT:-${HOME}/localghost}:${CODE_AGENT_WORKSPACE_ROOT:-${HOME}/localghost}"
    depends_on:
      db:
        condition: service_healthy
      searxng:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # Development: serves Vite with HMR over a bind mount instead of the built
  # bundle. Mutually exclusive with web (both bind 3000); pick one via profile.
  web-dev:
    <<: *app
    build:
      context: .
      target: dev
    profiles: [ dev ]
    ports:
      - "3000:3000"
      - "4206:4206" # TanStack devtools event bus; unpublished it spams ws errors in the browser
    volumes:
      - .:/app # live source for HMR
      - /app/node_modules # anonymous volume: keep the image's deps, don't shadow with host's
      - "${CODE_AGENT_WORKSPACE_ROOT:-${HOME}/localghost}:${CODE_AGENT_WORKSPACE_ROOT:-${HOME}/localghost}"
    environment:
      <<: *app-env

  # Bundled keyless web search, reachable by the app at http://searxng:8080.
  # See searxng/Dockerfile: config, base URL, and healthcheck are all baked in.
  searxng:
    build: ./searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    restart: unless-stopped

  # Bundled llama.cpp (llama-server, router mode), reachable by the app at
  # http://llamacpp:8080. Gated by the `llamacpp` profile; omitting it falls
  # back to a host-native llama-server. GPU overlays patch this service (see
  # compose.nvidia/amd/vulkan.yaml).
  # LLAMA_ARG_PORT pins against a pending upstream default change. LLAMA_API_KEY
  # (no ARG_ prefix, per --help) mirrors llm.server.ts's fallback placeholder.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-b10380
    profiles: [ llamacpp ]
    environment:
      LLAMA_CACHE: /models
      HF_TOKEN: ${HF_TOKEN:-}
      LLAMA_ARG_PORT: 8080
      LLAMA_API_KEY: ${LLAMACPP_API_KEY:-local-llamacpp}
      LLAMA_ARG_SLEEP_IDLE_SECONDS: ${LLAMA_SLEEP_IDLE_SECONDS:-300}
    volumes:
      - llamacpp:/models
    restart: unless-stopped

volumes:
  pg:
  llamacpp:
