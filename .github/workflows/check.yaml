name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push cancels its older run. Every run on main finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Has Chromium and its system libraries, so no apt step runs. The tag follows the installed playwright.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the version from packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - run: pnpm install --frozen-lockfile
      # src/generated/prisma is gitignored, and typecheck, lint and tests import it.
      - run: pnpm prisma generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm exec prettier --check .
      # Finds the image's Chromium when the tag matches, and downloads the browser when it doesn't.
      - run: pnpm exec playwright install chromium
      # The db project's setup finds the service listening, so it doesn't start Compose.
      # A job in a container reaches a service by its name.
      - run: pnpm test run
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/test
