# Overlay (merged via COMPOSE_FILE) for NVIDIA hosts. Requires the NVIDIA
# Container Toolkit. Gives the bundled llama.cpp full GPU access for inference
# and grants the app container nvidia-smi/NVML visibility (the `utility`
# capability, without the CUDA compute runtime) for the cookbook hardware
# panel. Omit on CPU-only hosts.
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:fc26b60b30836e5a12fdb28823a3d4bda984c9386a4b04200c78e5a5150067fb
    gpus: all
  web: &gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ utility ]
  web-dev: *gpu
