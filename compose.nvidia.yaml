# NVIDIA hosts (needs the NVIDIA Container Toolkit). The app gets `utility` for
# nvidia-smi in the Library hardware panel.
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b10920
    gpus: all
  web: &gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ utility ]
  web-dev: *gpu
