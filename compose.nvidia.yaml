# Overlay (merged via COMPOSE_FILE) for NVIDIA hosts. Requires the NVIDIA
# Container Toolkit. Gives the bundled Ollama full GPU access for inference and
# grants the app container nvidia-smi/NVML visibility (the `utility` capability,
# without the CUDA compute runtime) for the cookbook hardware panel. Omit on
# CPU-only hosts.
services:
  ollama:
    gpus: all
  web: &gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
  web-dev: *gpu