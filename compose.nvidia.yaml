# NVIDIA hosts (needs the NVIDIA Container Toolkit). The app gets `utility` for
# nvidia-smi in the Library hardware panel.
services:
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12375
    environment:
      LLAMA_ARG_FIT_TARGET: ${LLAMA_ARG_FIT_TARGET:-1024} # llama.cpp's default; here it's VRAM, not host RAM
    gpus: all
  web: &gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [utility]
  web-dev: *gpu
