# Config for an app-only (unpublished) SearXNG reached at searxng:8080. The
# JSON API and the limiter can't be set via environment variables.
use_default_settings:
  engines:
    remove:
      - ahmia # Tor-only engines that error without a Tor proxy
      - torch
      - wikidata # Needs a live call to query.wikidata.org on init; often 403s

server:
  # App-only, no reverse proxy: disable the limiter/bot detection. SearXNG's
  # one-time "no X-Forwarded-For" warning is expected here, not a bug.
  limiter: false
  public_instance: false

search:
  # The stock image serves HTML only; the app calls the JSON API.
  formats:
    - html
    - json
