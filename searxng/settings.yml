# Minimal SearXNG config for the bundled compose service. The stock image ships
# with the JSON API disabled and requires a secret key to boot, so we enable the
# `json` format the app parses and disable the bot limiter for local API access.
use_default_settings: true

server:
  secret_key: "change-me-local-dev"
  limiter: false

search:
  formats:
    - html
    - json
