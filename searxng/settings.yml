# The JSON API and limiter can only be set here, not via env vars.
use_default_settings:
  engines:
    remove:
      - ahmia # Tor-only engines that error without a Tor proxy
      - torch
      - wikidata # Needs a live call to query.wikidata.org on init; often 403s

server:
  # No reverse proxy, so no limiter. Its startup warnings about limiter.toml and
  # X-Forwarded-For are expected.
  limiter: false
  public_instance: false

search:
  # The app uses the JSON API.
  formats:
    - html
    - json
